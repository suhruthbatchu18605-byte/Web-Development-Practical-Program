<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Show / Hide Feature - JavaScript Programs</title>
  <link rel="stylesheet" href="../assets/css/program.css">
</head>
<body>

  <!-- Program Header & Navigation -->
  <header class="program-header">
    <div class="program-nav">
      <a href="../index.html" class="nav-btn">🏠 Home Dashboard</a>
      <span class="nav-sep">&rsaquo;</span>
      <a href="index.html" class="nav-btn">⬅ Back to JavaScript Programs</a>
    </div>
    <h1>Password Show / Hide Feature</h1>
    <p class="program-desc">Toggles input type between password and text with an icon indicator.</p>
  </header>

  <!-- Main Program Demonstration -->
  <main class="program-container">
    <div class="demo-card">
      <h2 class="demo-title">Demonstration Output</h2>
      <div style="display:flex; gap:0.5rem; max-width:320px;"><input type="password" id="passToggle" class="input-field" value="SecretPass123"><button class="btn btn-secondary" onclick="togglePassVisibility()">👁 Show/Hide</button></div>
    </div>
  </main>

  <!-- Program Footer -->
  <footer class="program-footer">
    <div class="footer-nav">
      <a href="../index.html" class="nav-btn">🏠 Home Dashboard</a>
      <a href="index.html" class="nav-btn">⬅ Back to JavaScript Programs List</a>
    </div>
    <p>&copy; Practical Programs Portfolio &bull; JavaScript Programs Section &bull; JS-77</p>
  </footer>

  <script>
function togglePassVisibility() { const el = document.getElementById('passToggle'); el.type = el.type === 'password' ? 'text' : 'password'; }
  </script>
</body>
</html>
