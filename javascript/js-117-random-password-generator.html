<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Password Generator - JavaScript Programs</title>
  <link rel="stylesheet" href="../assets/css/program.css">
</head>
<body>

  <!-- Program Header & Navigation -->
  <header class="program-header">
    <div class="program-nav">
      <a href="../index.html" class="nav-btn">🏠 Home Dashboard</a>
      <span class="nav-sep">&rsaquo;</span>
      <a href="index.html" class="nav-btn">⬅ Back to JavaScript Programs</a>
    </div>
    <h1>Random Password Generator</h1>
    <p class="program-desc">Generates customizable secure passwords with length, symbols, and digits.</p>
  </header>

  <!-- Main Program Demonstration -->
  <main class="program-container">
    <div class="demo-card">
      <h2 class="demo-title">Demonstration Output</h2>
      <div style="max-width:360px; margin:0 auto; text-align:center;"><input type="text" id="genPass" class="input-field" readonly style="font-family:monospace; text-align:center; font-size:1.2rem; margin-bottom:0.75rem;"><button class="btn btn-primary" onclick="generatePassword()">Generate Password</button></div>
    </div>
  </main>

  <!-- Program Footer -->
  <footer class="program-footer">
    <div class="footer-nav">
      <a href="../index.html" class="nav-btn">🏠 Home Dashboard</a>
      <a href="index.html" class="nav-btn">⬅ Back to JavaScript Programs List</a>
    </div>
    <p>&copy; Practical Programs Portfolio &bull; JavaScript Programs Section &bull; JS-117</p>
  </footer>

  <script>
function generatePassword() { const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()"; let res = ""; for(let i=0; i<12; i++) res += chars.charAt(Math.floor(Math.random() * chars.length)); document.getElementById('genPass').value = res; } generatePassword();
  </script>
</body>
</html>
