<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Remove Duplicate Elements from Array - JavaScript Programs</title>
  <link rel="stylesheet" href="../assets/css/program.css">
</head>
<body>

  <!-- Program Header & Navigation -->
  <header class="program-header">
    <div class="program-nav">
      <a href="../index.html" class="nav-btn">🏠 Home Dashboard</a>
      <span class="nav-sep">&rsaquo;</span>
      <a href="index.html" class="nav-btn">⬅ Back to JavaScript Programs</a>
    </div>
    <h1>Remove Duplicate Elements from Array</h1>
    <p class="program-desc">Filters out duplicates using ES6 Set and array.filter().</p>
  </header>

  <!-- Main Program Demonstration -->
  <main class="program-container">
    <div class="demo-card">
      <h2 class="demo-title">Demonstration Output</h2>
      <input type="text" id="dupInput" class="input-field" value="1, 2, 2, 3, 4, 4, 5, 5, 5"><button class="btn btn-primary" style="margin-top:1rem;" onclick="removeDups()">Remove Duplicates</button><div class="output-box" id="output">Result...</div>
    </div>
  </main>

  <!-- Program Footer -->
  <footer class="program-footer">
    <div class="footer-nav">
      <a href="../index.html" class="nav-btn">🏠 Home Dashboard</a>
      <a href="index.html" class="nav-btn">⬅ Back to JavaScript Programs List</a>
    </div>
    <p>&copy; Practical Programs Portfolio &bull; JavaScript Programs Section &bull; JS-55</p>
  </footer>

  <script>
function removeDups() { const arr = document.getElementById('dupInput').value.split(',').map(s => s.trim()); const unique = [...new Set(arr)]; document.getElementById('output').textContent = `Unique Array: [${unique.join(', ')}]`; }
  </script>
</body>
</html>
