<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fibonacci Series Generator - JavaScript Programs</title>
  <link rel="stylesheet" href="../assets/css/program.css">
</head>
<body>

  <!-- Program Header & Navigation -->
  <header class="program-header">
    <div class="program-nav">
      <a href="../index.html" class="nav-btn">🏠 Home Dashboard</a>
      <span class="nav-sep">&rsaquo;</span>
      <a href="index.html" class="nav-btn">⬅ Back to JavaScript Programs</a>
    </div>
    <h1>Fibonacci Series Generator</h1>
    <p class="program-desc">Generates Fibonacci sequence up to N terms.</p>
  </header>

  <!-- Main Program Demonstration -->
  <main class="program-container">
    <div class="demo-card">
      <h2 class="demo-title">Demonstration Output</h2>
      
     <div class="input-group"><label>Number of Terms (N)</label><input type="number" id="fiboN" class="input-field" value="10" min="1" max="50"></div>
     <button class="btn btn-primary" onclick="genFibo()">Generate Series</button>
     <div class="output-box" id="output">Result will appear here...</div>
     
    </div>
  </main>

  <!-- Program Footer -->
  <footer class="program-footer">
    <div class="footer-nav">
      <a href="../index.html" class="nav-btn">🏠 Home Dashboard</a>
      <a href="index.html" class="nav-btn">⬅ Back to JavaScript Programs List</a>
    </div>
    <p>&copy; Practical Programs Portfolio &bull; JavaScript Programs Section &bull; JS-07</p>
  </footer>

  <script>

     function genFibo() {
       const n = parseInt(document.getElementById('fiboN').value);
       if (isNaN(n) || n <= 0) return;
       let fib = [0, 1];
       while (fib.length < n) {
         fib.push(fib[fib.length - 1] + fib[fib.length - 2]);
       }
       fib = fib.slice(0, n);
       document.getElementById('output').textContent = `Fibonacci Series (${n} terms):\n${fib.join(', ')}`;
     }
     
  </script>
</body>
</html>
