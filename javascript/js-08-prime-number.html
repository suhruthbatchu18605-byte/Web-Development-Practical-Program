<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prime Number Checker - JavaScript Programs</title>
  <link rel="stylesheet" href="../assets/css/program.css">
</head>
<body>

  <!-- Program Header & Navigation -->
  <header class="program-header">
    <div class="program-nav">
      <a href="../index.html" class="nav-btn">🏠 Home Dashboard</a>
      <span class="nav-sep">&rsaquo;</span>
      <a href="index.html" class="nav-btn">⬅ Back to JavaScript Programs</a>
    </div>
    <h1>Prime Number Checker</h1>
    <p class="program-desc">Checks whether an input integer is prime or composite.</p>
  </header>

  <!-- Main Program Demonstration -->
  <main class="program-container">
    <div class="demo-card">
      <h2 class="demo-title">Demonstration Output</h2>
      
     <div class="input-group"><label>Enter an Integer (> 1)</label><input type="number" id="primeInput" class="input-field" value="29"></div>
     <button class="btn btn-primary" onclick="checkPrime()">Check Prime</button>
     <div class="output-box" id="output">Result will appear here...</div>
     
    </div>
  </main>

  <!-- Program Footer -->
  <footer class="program-footer">
    <div class="footer-nav">
      <a href="../index.html" class="nav-btn">🏠 Home Dashboard</a>
      <a href="index.html" class="nav-btn">⬅ Back to JavaScript Programs List</a>
    </div>
    <p>&copy; Practical Programs Portfolio &bull; JavaScript Programs Section &bull; JS-08</p>
  </footer>

  <script>

     function checkPrime() {
       const n = parseInt(document.getElementById('primeInput').value);
       if (isNaN(n) || n <= 1) { document.getElementById('output').textContent = `${n} is not a prime number. (Primes are integers > 1)`; return; }
       let isPrime = true;
       for (let i = 2; i <= Math.sqrt(n); i++) {
         if (n % i === 0) { isPrime = false; break; }
       }
       document.getElementById('output').textContent = `${n} is a ${isPrime ? 'PRIME' : 'COMPOSITE'} number.`;
     }
     
  </script>
</body>
</html>
