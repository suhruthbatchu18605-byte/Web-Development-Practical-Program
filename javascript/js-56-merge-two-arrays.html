<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Merge Two Arrays - JavaScript Programs</title>
  <link rel="stylesheet" href="../assets/css/program.css">
</head>
<body>

  <!-- Program Header & Navigation -->
  <header class="program-header">
    <div class="program-nav">
      <a href="../index.html" class="nav-btn">🏠 Home Dashboard</a>
      <span class="nav-sep">&rsaquo;</span>
      <a href="index.html" class="nav-btn">⬅ Back to JavaScript Programs</a>
    </div>
    <h1>Merge Two Arrays</h1>
    <p class="program-desc">Merges two arrays into one unified list using concat and spread syntax.</p>
  </header>

  <!-- Main Program Demonstration -->
  <main class="program-container">
    <div class="demo-card">
      <h2 class="demo-title">Demonstration Output</h2>
      <div style="display:flex; gap:1rem;"><input type="text" id="mArr1" class="input-field" value="1, 3, 5"><input type="text" id="mArr2" class="input-field" value="2, 4, 6"></div><button class="btn btn-primary" style="margin-top:1rem;" onclick="mergeArrays()">Merge Arrays</button><div class="output-box" id="output">Result...</div>
    </div>
  </main>

  <!-- Program Footer -->
  <footer class="program-footer">
    <div class="footer-nav">
      <a href="../index.html" class="nav-btn">🏠 Home Dashboard</a>
      <a href="index.html" class="nav-btn">⬅ Back to JavaScript Programs List</a>
    </div>
    <p>&copy; Practical Programs Portfolio &bull; JavaScript Programs Section &bull; JS-56</p>
  </footer>

  <script>
function mergeArrays() { const a = document.getElementById('mArr1').value.split(',').map(s => s.trim()); const b = document.getElementById('mArr2').value.split(',').map(s => s.trim()); const merged = [...a, ...b]; document.getElementById('output').textContent = `Merged Array: [${merged.join(', ')}]`; }
  </script>
</body>
</html>
