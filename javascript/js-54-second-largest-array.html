<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Second-Largest Element in an Array - JavaScript Programs</title>
  <link rel="stylesheet" href="../assets/css/program.css">
</head>
<body>

  <!-- Program Header & Navigation -->
  <header class="program-header">
    <div class="program-nav">
      <a href="../index.html" class="nav-btn">🏠 Home Dashboard</a>
      <span class="nav-sep">&rsaquo;</span>
      <a href="index.html" class="nav-btn">⬅ Back to JavaScript Programs</a>
    </div>
    <h1>Second-Largest Element in an Array</h1>
    <p class="program-desc">Finds the second largest distinct number in a user array.</p>
  </header>

  <!-- Main Program Demonstration -->
  <main class="program-container">
    <div class="demo-card">
      <h2 class="demo-title">Demonstration Output</h2>
      <input type="text" id="secondMaxInput" class="input-field" value="10, 45, 99, 82, 33"><button class="btn btn-primary" style="margin-top:1rem;" onclick="findSecondMax()">Find 2nd Largest</button><div class="output-box" id="output">Result...</div>
    </div>
  </main>

  <!-- Program Footer -->
  <footer class="program-footer">
    <div class="footer-nav">
      <a href="../index.html" class="nav-btn">🏠 Home Dashboard</a>
      <a href="index.html" class="nav-btn">⬅ Back to JavaScript Programs List</a>
    </div>
    <p>&copy; Practical Programs Portfolio &bull; JavaScript Programs Section &bull; JS-54</p>
  </footer>

  <script>
function findSecondMax() { const nums = [...new Set(document.getElementById('secondMaxInput').value.split(',').map(s => parseFloat(s.trim())).filter(n => !isNaN(n)))].sort((a,b) => b - a); document.getElementById('output').textContent = nums.length > 1 ? `Second Largest: ${nums[1]}` : 'Need at least 2 distinct numbers.'; }
  </script>
</body>
</html>
