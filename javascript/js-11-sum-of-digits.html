<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sum of Digits of a Number - JavaScript Programs</title>
  <link rel="stylesheet" href="../assets/css/program.css">
</head>
<body>

  <!-- Program Header & Navigation -->
  <header class="program-header">
    <div class="program-nav">
      <a href="../index.html" class="nav-btn">🏠 Home Dashboard</a>
      <span class="nav-sep">&rsaquo;</span>
      <a href="index.html" class="nav-btn">⬅ Back to JavaScript Programs</a>
    </div>
    <h1>Sum of Digits of a Number</h1>
    <p class="program-desc">Calculates the sum of all digits of an integer.</p>
  </header>

  <!-- Main Program Demonstration -->
  <main class="program-container">
    <div class="demo-card">
      <h2 class="demo-title">Demonstration Output</h2>
      
     <div class="input-group"><label>Enter an Integer</label><input type="number" id="sumDigitsInput" class="input-field" value="4567"></div>
     <button class="btn btn-primary" onclick="sumDigits()">Calculate Sum</button>
     <div class="output-box" id="output">Result will appear here...</div>
     
    </div>
  </main>

  <!-- Program Footer -->
  <footer class="program-footer">
    <div class="footer-nav">
      <a href="../index.html" class="nav-btn">🏠 Home Dashboard</a>
      <a href="index.html" class="nav-btn">⬅ Back to JavaScript Programs List</a>
    </div>
    <p>&copy; Practical Programs Portfolio &bull; JavaScript Programs Section &bull; JS-11</p>
  </footer>

  <script>

     function sumDigits() {
       const num = Math.abs(parseInt(document.getElementById('sumDigitsInput').value));
       const digits = String(num).split('').map(Number);
       const sum = digits.reduce((acc, curr) => acc + curr, 0);
       document.getElementById('output').textContent = `Digits: ${digits.join(' + ')} = ${sum}`;
     }
     
  </script>
</body>
</html>
