<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Count Number of Digits in a Number - JavaScript Programs</title>
  <link rel="stylesheet" href="../assets/css/program.css">
</head>
<body>

  <!-- Program Header & Navigation -->
  <header class="program-header">
    <div class="program-nav">
      <a href="../index.html" class="nav-btn">🏠 Home Dashboard</a>
      <span class="nav-sep">&rsaquo;</span>
      <a href="index.html" class="nav-btn">⬅ Back to JavaScript Programs</a>
    </div>
    <h1>Count Number of Digits in a Number</h1>
    <p class="program-desc">Counts total number of digits of an integer.</p>
  </header>

  <!-- Main Program Demonstration -->
  <main class="program-container">
    <div class="demo-card">
      <h2 class="demo-title">Demonstration Output</h2>
      <input type="number" id="countDigitsInput" class="input-field" value="987654321"><button class="btn btn-primary" style="margin-top:1rem;" onclick="countDigits()">Count Digits</button><div class="output-box" id="output">Result...</div>
    </div>
  </main>

  <!-- Program Footer -->
  <footer class="program-footer">
    <div class="footer-nav">
      <a href="../index.html" class="nav-btn">🏠 Home Dashboard</a>
      <a href="index.html" class="nav-btn">⬅ Back to JavaScript Programs List</a>
    </div>
    <p>&copy; Practical Programs Portfolio &bull; JavaScript Programs Section &bull; JS-53</p>
  </footer>

  <script>
function countDigits() { const n = Math.abs(parseInt(document.getElementById('countDigitsInput').value)); const count = String(n).length; document.getElementById('output').textContent = `Total digits in ${n}: ${count}`; }
  </script>
</body>
</html>
