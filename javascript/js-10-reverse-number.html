<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reverse a Number - JavaScript Programs</title>
  <link rel="stylesheet" href="../assets/css/program.css">
</head>
<body>

  <!-- Program Header & Navigation -->
  <header class="program-header">
    <div class="program-nav">
      <a href="../index.html" class="nav-btn">🏠 Home Dashboard</a>
      <span class="nav-sep">&rsaquo;</span>
      <a href="index.html" class="nav-btn">⬅ Back to JavaScript Programs</a>
    </div>
    <h1>Reverse a Number</h1>
    <p class="program-desc">Reverses the digits of any entered integer.</p>
  </header>

  <!-- Main Program Demonstration -->
  <main class="program-container">
    <div class="demo-card">
      <h2 class="demo-title">Demonstration Output</h2>
      
     <div class="input-group"><label>Enter an Integer</label><input type="number" id="revInput" class="input-field" value="987654"></div>
     <button class="btn btn-primary" onclick="reverseNumber()">Reverse Number</button>
     <div class="output-box" id="output">Result will appear here...</div>
     
    </div>
  </main>

  <!-- Program Footer -->
  <footer class="program-footer">
    <div class="footer-nav">
      <a href="../index.html" class="nav-btn">🏠 Home Dashboard</a>
      <a href="index.html" class="nav-btn">⬅ Back to JavaScript Programs List</a>
    </div>
    <p>&copy; Practical Programs Portfolio &bull; JavaScript Programs Section &bull; JS-10</p>
  </footer>

  <script>

     function reverseNumber() {
       const num = parseInt(document.getElementById('revInput').value);
       let n = Math.abs(num);
       let rev = 0;
       while (n > 0) {
         rev = rev * 10 + (n % 10);
         n = Math.floor(n / 10);
       }
       if (num < 0) rev = -rev;
       document.getElementById('output').textContent = `Input: ${num}\nReversed: ${rev}`;
     }
     
  </script>
</body>
</html>
