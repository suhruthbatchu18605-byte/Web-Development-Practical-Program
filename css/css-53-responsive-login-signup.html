<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Login and Signup Page - CSS Programs</title>
  <link rel="stylesheet" href="../assets/css/program.css">
</head>
<body>

  <!-- Program Header & Navigation -->
  <header class="program-header">
    <div class="program-nav">
      <a href="../index.html" class="nav-btn">🏠 Home Dashboard</a>
      <span class="nav-sep">&rsaquo;</span>
      <a href="index.html" class="nav-btn">⬅ Back to CSS Programs</a>
    </div>
    <h1>Responsive Login and Signup Page</h1>
    <p class="program-desc">Dual-form responsive layout with tabbed toggle between Login and Account Registration.</p>
  </header>

  <!-- Main Program Demonstration -->
  <main class="program-container">
    <div class="demo-card">
      <h2 class="demo-title">Demonstration Output</h2>
      
     <div class="demo-card">
       <div style="max-width: 440px; margin: 0 auto; background: #0b1120; padding: 2rem; border-radius: 12px; border: 1px solid var(--border);">
         <div style="display: flex; border-bottom: 1px solid var(--border); margin-bottom: 1.5rem;">
           <button class="btn" style="flex: 1; border-radius: 0; background: transparent; border-bottom: 2px solid #4f46e5; color: white;">Login</button>
           <button class="btn" style="flex: 1; border-radius: 0; background: transparent; color: var(--text-muted);">Sign Up</button>
         </div>
         <div class="input-group"><label>Email Address</label><input type="email" class="input-field" placeholder="user@email.com"></div>
         <div class="input-group"><label>Password</label><input type="password" class="input-field" placeholder="••••••••"></div>
         <button class="btn btn-primary" style="width: 100%;">Continue &rarr;</button>
       </div>
     </div>
     
    </div>
  </main>

  <!-- Program Footer -->
  <footer class="program-footer">
    <div class="footer-nav">
      <a href="../index.html" class="nav-btn">🏠 Home Dashboard</a>
      <a href="index.html" class="nav-btn">⬅ Back to CSS Programs List</a>
    </div>
    <p>&copy; Practical Programs Portfolio &bull; CSS Programs Section &bull; CSS-53</p>
  </footer>

</body>
</html>
